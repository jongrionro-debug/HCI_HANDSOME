name: memory-tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-tests:
    name: memory-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit and SQLite integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run synthetic CLI demo
        env:
          PYTHONPATH: src
        run: python -m stylemate_memory.cli demo --synthetic
      - name: Check repository documents
        run: python scripts/check_repository.py
