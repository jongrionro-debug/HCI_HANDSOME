[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stylemate-memory"
version = "0.1.0"
description = "Shopping memory context and target-feature inference prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stylemate-memory = "stylemate_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stylemate_memory = ["inspector.html"]
